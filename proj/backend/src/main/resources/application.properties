# The schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading during view rendering (removes the startup warning).
spring.jpa.open-in-view=false
# Access tokens (US01). The signing secret comes from the APP_JWT_SECRET environment variable.
app.jwt.time-to-live=PT1H
# US13: initial ADMIN, created at startup when no account has this email. Set the values per
# environment (never commit real ones); without them no admin is created and a warning is logged.
app.admin.name=${ADMIN_NAME:Platform Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# US09: telemetry from the fleet simulator over MQTT (simulator contract 1.0.0). Off by default;
# Docker Compose turns it on. Host, port, credentials and fleet: see TelemetryProperties.
app.telemetry.enabled=false
# US09: register the hubs and vehicles of the simulator's default scenario at start-up, so its
# readings are about vehicles the platform knows. Off by default; Docker Compose turns it on.
app.demo.seed-fleet=false
# US03 (KAN-96): the simulated payment gateway. Docker Compose sets the URL. A charge with no answer
# within the read timeout counts as not paid (BR10); keep it below the gateway's timeout delay.
app.payment.base-url=${APP_PAYMENT_BASE_URL:http://localhost:8090}
app.payment.connect-timeout=PT2S
app.payment.read-timeout=PT5S
# US03 (BR9): stay codes are valid on calendar days at the hotel, so "today" is taken in this zone.
# Instants (pass validity, payments) are kept in UTC.
app.passes.zone=Europe/Lisbon
# US04: how long a command to a vehicle (unlock) stays valid after it is sent, its expiresAt in the
# simulator contract; a command delayed longer in the broker is rejected instead of applied late.
app.telemetry.command-ttl=PT30S
# US05 (BR7): how often reservations not started in their window are expired, giving back the
# vehicle and the deposit. A reservation past its window can never be started, whatever this is.
app.bookings.expiry.enabled=true
app.bookings.expiry.interval=PT30S
