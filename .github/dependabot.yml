version: 2
updates:
  - package-ecosystem: maven
    directory: /proj/backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Lisbon
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /proj/frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Lisbon
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Lisbon
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci